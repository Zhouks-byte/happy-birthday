<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11152f">
  <title>祝你生日快乐</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #11152f;
      --ink: #fff9f1;
      --muted: #c7c9e1;
      --pink: #ff8eb7;
      --peach: #ffc28d;
      --gold: #ffe49b;
      --violet: #aaa0ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Aptos", "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(ellipse at 50% 56%, rgba(84, 69, 137, .28), transparent 44%),
        radial-gradient(ellipse at 14% 13%, rgba(80, 105, 170, .17), transparent 30%),
        radial-gradient(ellipse at 88% 20%, rgba(184, 91, 145, .14), transparent 27%),
        var(--night);
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 36vmin;
      height: 36vmin;
      border-radius: 50%;
      content: "";
      filter: blur(85px);
      opacity: .17;
      pointer-events: none;
    }

    body::before { top: -18vmin; left: -13vmin; background: #687cff; }
    body::after { right: -14vmin; bottom: -18vmin; background: #ff75ac; }

    .scene {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      grid-template-rows: auto 1fr auto;
      padding: clamp(22px, 4vw, 46px) clamp(20px, 6vw, 82px) 25px;
      isolation: isolate;
    }

    .topline,
    .footline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      animation: fade-in .8s .2s both;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { color: var(--gold); font-size: 20px; }

    .day-tag {
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 99px;
      background: rgba(255,255,255,.045);
    }

    .content {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 22px 0;
      text-align: center;
    }

    .glow-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(66vw, 690px);
      aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 50%;
      transform: translate(-50%, -46%);
      box-shadow: 0 0 0 46px rgba(255,255,255,.016), 0 0 0 92px rgba(255,255,255,.012);
      pointer-events: none;
    }

    .hero {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      padding: 8px 0 0;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .34em;
      animation: rise-in .8s .25s both;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 9.4vw, 104px);
      font-weight: 800;
      letter-spacing: .035em;
      line-height: 1.22;
      text-shadow: 0 7px 38px rgba(255, 142, 183, .12);
    }

    h1 span {
      display: inline-block;
      opacity: 0;
      background: linear-gradient(110deg, #fff7e7 4%, #ffd28f 39%, #ff91bb 73%, #c4b5ff 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: letter-pop .72s cubic-bezier(.16, 1.3, .36, 1) forwards;
    }

    h1 span:nth-child(1) { animation-delay: .42s; }
    h1 span:nth-child(2) { animation-delay: .5s; }
    h1 span:nth-child(3) { animation-delay: .58s; }
    h1 span:nth-child(4) { animation-delay: .66s; }
    h1 span:nth-child(5) { animation-delay: .74s; }
    h1 span:nth-child(6) { animation-delay: .82s; }
    h1 span:nth-child(7) { animation-delay: .9s; }
    h1 span:nth-child(8) { animation-delay: .98s; }

    .wish {
      margin: 12px 0 0;
      color: #e1def0;
      font-size: clamp(14px, 2vw, 17px);
      letter-spacing: .16em;
      animation: rise-in .8s 1.05s both;
    }

    .cake-wrap {
      position: relative;
      width: min(310px, 60vw);
      margin: clamp(13px, 3vh, 25px) auto 19px;
      animation: cake-in 1s .7s both;
      filter: drop-shadow(0 15px 25px rgba(5, 7, 27, .25));
    }

    .cake {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .flame {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: flame .52s ease-in-out infinite alternate;
    }

    .flame:nth-of-type(2) { animation-delay: -.18s; }
    .flame:nth-of-type(3) { animation-delay: -.31s; }
    .flame:nth-of-type(4) { animation-delay: -.09s; }

    .cta {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 22px;
      border: 1px solid rgba(255, 224, 155, .55);
      border-radius: 999px;
      color: #302544;
      background: linear-gradient(110deg, #ffe7b2, #ffb7bd 100%);
      box-shadow: 0 7px 28px rgba(255, 167, 177, .16);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      animation: rise-in .8s 1.3s both;
    }

    .cta:hover { transform: translateY(-2px); box-shadow: 0 11px 32px rgba(255, 167, 177, .3); }
    .cta:active { transform: translateY(0) scale(.98); }
    .cta:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    .balloon {
      position: absolute;
      z-index: 0;
      width: clamp(54px, 8vw, 100px);
      opacity: .94;
      animation: float 5s ease-in-out infinite;
    }

    .balloon svg { display: block; width: 100%; overflow: visible; }
    .balloon-left { top: 16%; left: 9%; animation-delay: -1.2s; }
    .balloon-right { top: 12%; right: 10%; animation-delay: -.3s; }
    .balloon-low-left { bottom: 13%; left: 19%; width: clamp(38px, 5vw, 63px); animation-delay: -2.4s; }
    .balloon-low-right { right: 19%; bottom: 12%; width: clamp(42px, 5.5vw, 70px); animation-delay: -3s; }

    .spark {
      position: absolute;
      z-index: 0;
      color: var(--gold);
      font-size: clamp(15px, 2vw, 25px);
      animation: twinkle 2.5s ease-in-out infinite;
    }
    .spark-a { top: 23%; left: 27%; }
    .spark-b { top: 33%; right: 24%; animation-delay: .8s; color: var(--pink); }
    .spark-c { right: 31%; bottom: 20%; animation-delay: 1.3s; }
    .spark-d { bottom: 29%; left: 30%; animation-delay: .4s; color: var(--violet); }

    .footline { justify-content: center; gap: 8px; font-size: 10px; letter-spacing: .17em; }
    .footline .divider { color: var(--gold); font-size: 14px; }

    .confetti {
      position: fixed;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes letter-pop {
      0% { opacity: 0; transform: translateY(24px) scale(.78) rotate(-5deg); }
      72% { opacity: 1; transform: translateY(-4px) scale(1.06) rotate(1deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }
    @keyframes cake-in {
      from { opacity: 0; transform: translateY(20px) scale(.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes flame {
      from { transform: rotate(-5deg) scale(.92, 1.06); }
      to { transform: rotate(6deg) scale(1.06, .94); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-16px) rotate(4deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.78) rotate(0); }
      50% { opacity: 1; transform: scale(1.16) rotate(20deg); }
    }

    @media (max-height: 700px) {
      .scene { padding-top: 18px; padding-bottom: 16px; }
      .cake-wrap { width: min(245px, 48vw); margin: 10px auto 12px; }
      h1 { font-size: clamp(44px, 8vw, 82px); }
      .wish { margin-top: 5px; }
      .balloon-left { top: 8%; }
      .balloon-right { top: 7%; }
    }

    @media (max-width: 600px) {
      .scene { padding-right: 20px; padding-left: 20px; }
      .topline { font-size: 9px; letter-spacing: .13em; }
      .day-tag { padding: 8px 10px; }
      .glow-ring { width: 92vw; }
      .balloon-left { top: 14%; left: 0; }
      .balloon-right { top: 12%; right: 0; }
      .balloon-low-left { bottom: 9%; left: 4%; }
      .balloon-low-right { right: 5%; bottom: 9%; }
      .spark-a { top: 22%; left: 17%; }
      .spark-b { top: 30%; right: 13%; }
      .spark-c { right: 20%; bottom: 17%; }
      .spark-d { bottom: 25%; left: 18%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>A DAY TO CELEBRATE</span></div>
      <span class="day-tag">今天，主角是你</span>
    </header>

    <section class="content" aria-label="生日祝福动画">
      <div class="glow-ring" aria-hidden="true"></div>

      <div class="balloon balloon-left" aria-hidden="true">
        <svg viewBox="0 0 90 150">
          <defs><linearGradient id="bl" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffc88c"/><stop offset="1" stop-color="#ff7eae"/></linearGradient></defs>
          <ellipse cx="45" cy="45" rx="31" ry="39" fill="url(#bl)"/><path d="M39 82l6 8 6-8M45 90c4 17-7 24 1 36s-4 14-2 22" fill="none" stroke="#ffd5dc" stroke-width="1.5" opacity=".75"/><ellipse cx="34" cy="31" rx="5" ry="10" fill="#fff" opacity=".28" transform="rotate(-28 34 31)"/>
        </svg>
      </div>
      <div class="balloon balloon-right" aria-hidden="true">
        <svg viewBox="0 0 90 150">
          <defs><linearGradient id="br" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#a8a1ff"/><stop offset="1" stop-color="#7478e8"/></linearGradient></defs>
          <ellipse cx="45" cy="45" rx="31" ry="39" fill="url(#br)"/><path d="M39 82l6 8 6-8M45 90c-5 15 6 23-2 35s5 15 1 23" fill="none" stroke="#ddd9ff" stroke-width="1.5" opacity=".75"/><ellipse cx="34" cy="31" rx="5" ry="10" fill="#fff" opacity=".3" transform="rotate(-28 34 31)"/>
        </svg>
      </div>
      <div class="balloon balloon-low-left" aria-hidden="true">
        <svg viewBox="0 0 90 150">
          <ellipse cx="45" cy="45" rx="31" ry="39" fill="#7ddbd0"/><path d="M39 82l6 8 6-8M45 90c4 17-7 24 1 36s-4 14-2 22" fill="none" stroke="#d4fff4" stroke-width="1.5" opacity=".75"/><ellipse cx="34" cy="31" rx="5" ry="10" fill="#fff" opacity=".35" transform="rotate(-28 34 31)"/>
        </svg>
      </div>
      <div class="balloon balloon-low-right" aria-hidden="true">
        <svg viewBox="0 0 90 150">
          <ellipse cx="45" cy="45" rx="31" ry="39" fill="#ffcf73"/><path d="M39 82l6 8 6-8M45 90c-5 15 6 23-2 35s5 15 1 23" fill="none" stroke="#fff1c9" stroke-width="1.5" opacity=".8"/><ellipse cx="34" cy="31" rx="5" ry="10" fill="#fff" opacity=".38" transform="rotate(-28 34 31)"/>
        </svg>
      </div>

      <span class="spark spark-a" aria-hidden="true">✦</span>
      <span class="spark spark-b" aria-hidden="true">✧</span>
      <span class="spark spark-c" aria-hidden="true">✦</span>
      <span class="spark spark-d" aria-hidden="true">✧</span>

      <div class="hero">
        <p class="eyebrow">HAPPY BIRTHDAY</p>
        <h1 aria-label="祝你生日快乐"><span>祝</span><span>你</span><span>生</span><span>日</span><span>快</span><span>乐</span><span>！</span></h1>
        <p class="wish">愿每一个愿望，都闪闪发光</p>

        <div class="cake-wrap" aria-hidden="true">
          <svg class="cake" viewBox="0 0 360 225" role="img">
            <defs>
              <linearGradient id="cakeTop" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff1d1"/><stop offset="1" stop-color="#ffc5cd"/></linearGradient>
              <linearGradient id="cakeMid" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffb3c7"/><stop offset="1" stop-color="#e977a8"/></linearGradient>
              <linearGradient id="cakeBase" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b7a4ff"/><stop offset="1" stop-color="#8174d8"/></linearGradient>
            </defs>
            <ellipse cx="180" cy="193" rx="133" ry="17" fill="#090c21" opacity=".35"/>
            <path d="M70 130h220v47c0 17-49 31-110 31S70 194 70 177z" fill="url(#cakeBase)"/>
            <ellipse cx="180" cy="130" rx="110" ry="29" fill="#d2c5ff"/>
            <path d="M90 91h180v43c0 15-40 27-90 27s-90-12-90-27z" fill="url(#cakeMid)"/>
            <ellipse cx="180" cy="91" rx="90" ry="25" fill="#ffd0d7"/>
            <path d="M96 92c17 8 31 9 43 2 11-6 17 6 29 8 15 3 20-8 31-8 11 0 17 10 30 9 12 0 22-4 35-11-3-14-39-26-84-26S100 78 96 92z" fill="url(#cakeTop)"/>
            <path d="M121 92v13c0 8 12 8 12 0V94m41 9v12c0 8 12 8 12 0v-13m43-8v13c0 8 12 8 12 0V91" fill="#fff1d1"/>
            <circle cx="123" cy="84" r="4" fill="#ff8eb7"/><circle cx="151" cy="77" r="4" fill="#ffcf73"/><circle cx="180" cy="74" r="4" fill="#8cdbd0"/><circle cx="209" cy="77" r="4" fill="#aa9cff"/><circle cx="237" cy="84" r="4" fill="#ff8eb7"/>
            <path d="M132 63V39m48 24V33m48 30V39" stroke="#fff0c9" stroke-width="7" stroke-linecap="round"/>
            <path d="M132 51h0m48-7h0m48 7h0" stroke="#ff8eb7" stroke-width="7" stroke-linecap="round"/>
            <g class="flame" fill="#ffe49b"><path d="M132 18c-2 8-11 12-8 20 2 7 13 8 17 2 5-7-1-15-9-22z"/></g>
            <g class="flame" fill="#ffe49b"><path d="M180 11c-2 8-11 12-8 20 2 7 13 8 17 2 5-7-1-15-9-22z"/></g>
            <g class="flame" fill="#ffe49b"><path d="M228 18c-2 8-11 12-8 20 2 7 13 8 17 2 5-7-1-15-9-22z"/></g>
            <circle cx="132" cy="31" r="4" fill="#fff7df"/><circle cx="180" cy="24" r="4" fill="#fff7df"/><circle cx="228" cy="31" r="4" fill="#fff7df"/>
          </svg>
        </div>

        <button class="cta" id="wish-button" type="button"><span aria-hidden="true">✦</span> 点亮生日祝福</button>
      </div>
    </section>

    <footer class="footline"><span>MAKE A WISH</span><span class="divider" aria-hidden="true">✦</span><span>AND LET IT SHINE</span></footer>
    <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("confetti");
      const context = canvas.getContext("2d");
      const button = document.getElementById("wish-button");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const colors = ["#ff8eb7", "#ffc28d", "#ffe49b", "#aaa0ff", "#7ddbd0", "#fff5df"];
      let pieces = [];
      let frame = 0;
      let width = 0;
      let height = 0;

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function burst(x, y, amount = 110) {
        for (let i = 0; i < amount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 7;
          pieces.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            size: 3 + Math.random() * 5,
            spin: Math.random() * Math.PI,
            spinSpeed: (Math.random() - .5) * .22,
            gravity: .08 + Math.random() * .1,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1
          });
        }
        if (!frame) animate();
      }

      function animate() {
        context.clearRect(0, 0, width, height);
        pieces = pieces.filter(piece => piece.life > 0 && piece.y < height + 20);
        for (const piece of pieces) {
          piece.x += piece.vx;
          piece.y += piece.vy;
          piece.vy += piece.gravity;
          piece.vx *= .995;
          piece.spin += piece.spinSpeed;
          piece.life -= .008;
          context.save();
          context.translate(piece.x, piece.y);
          context.rotate(piece.spin);
          context.globalAlpha = Math.max(0, piece.life);
          context.fillStyle = piece.color;
          context.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size * .68);
          context.restore();
        }
        if (pieces.length) frame = requestAnimationFrame(animate);
        else {
          frame = 0;
          context.clearRect(0, 0, width, height);
        }
      }

      resize();
      window.addEventListener("resize", resize);
      window.addEventListener("load", () => {
        if (!reduceMotion.matches) {
          window.setTimeout(() => burst(width / 2, height * .42, 75), 1150);
        }
      }, { once: true });
      button.addEventListener("click", event => {
        const bounds = button.getBoundingClientRect();
        const x = event.clientX || bounds.left + bounds.width / 2;
        const y = event.clientY || bounds.top + bounds.height / 2;
        burst(x, y, reduceMotion.matches ? 28 : 150);
        button.innerHTML = '<span aria-hidden="true">✦</span> 愿你的每一天都闪闪发光';
      });
    })();
  </script>
</body>
</html>
